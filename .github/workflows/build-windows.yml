name: Build Windows desktop installer

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'electron/**'
      - 'webapp/**'
      - 'package.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Electron build tools
        run: npm install --no-audit --no-fund
      - name: Run application checks
        run: npm test
      - name: Build Windows installer
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'electron-builder.log'
          npm run desktop:win 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish build log on failure
        if: failure()
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'electron-builder.log'
          if (Test-Path $log) {
            Add-Content $env:GITHUB_STEP_SUMMARY '### Electron Builder output (last 100 lines)'
            Get-Content $log -Tail 100 | Add-Content $env:GITHUB_STEP_SUMMARY
          }
      - name: Upload installer artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarPOS-Windows-x64
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
