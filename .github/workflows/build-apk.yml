name: ساخت APK اندروید

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بررسی ساختار فایلهای وب
        run: node tools/check.js

      # The build log is mirrored into the job summary so it can be read via
      # api.github.com (helpful in restricted / offline environments).
      - name: ساخت APK نسخه Debug
        working-directory: android
        shell: bash
        run: |
          # GitHub runs bash with -e by default; disable it so we can capture the log.
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### خروجی Gradle (exit $rc)"
              echo '```text'
              tail -n 200 /tmp/gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarPOS-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
