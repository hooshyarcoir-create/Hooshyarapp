name: ساخت APK اندروید

on:
  push:
    branches: ['**']
    # The build result is committed back to the branch; ignore it so the
    # workflow does not trigger itself in a loop.
    paths-ignore:
      - 'HooshyarPOS-debug.apk'
      - 'ci-gradle.log'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بررسی ساختار فایلهای وب
        run: node tools/check.js

      - name: ساخت APK نسخه Debug
        working-directory: android
        shell: bash
        run: |
          # GitHub runs bash with -e; disable it to capture the log on failure.
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### خروجی Gradle (exit $rc)"
              echo '```text'
              tail -n 200 /tmp/gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: بارگذاری APK بهعنوان Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarPOS-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Also keep the installable APK in the repository so it can be fetched
      # from github.com directly (no artifact CDN required).
      - name: قرار دادن APK در مخزن
        if: success()
        run: |
          cp android/app/build/outputs/apk/debug/*.apk HooshyarPOS-debug.apk
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI Bot"
          git add HooshyarPOS-debug.apk
          git diff --cached --quiet && exit 0
          git commit -m "build: APK نسخه Debug [skip ci]"
          git push origin "HEAD:${GITHUB_REF_NAME}"
