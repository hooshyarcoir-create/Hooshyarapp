name: ساخت APK اندروید

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بررسی ساختار فایلهای وب
        run: node tools/check.js

      # The build log is mirrored into a check-run annotation so it can be read
      # through api.github.com (useful in restricted/offline environments).
      - name: ساخت APK نسخه Debug
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            python3 -c "s=open('/tmp/gradle-build.log',errors='replace').read().splitlines()[-180:]; m='%0A'.join(x.replace('%','%25').replace('\r','%0D') for x in s); print('::error title=gradle failed::'+m)"
          fi
          exit "$rc"

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarPOS-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
