name: ساخت APK اندروید

on:
  push:
    branches: ['**']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: دریافت سورس
        uses: actions/checkout@v4

      - name: نصب Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: نصب Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: بررسی ساختار فایلهای وب
        run: node tools/check.js

      - name: ساخت APK نسخه Debug
        working-directory: android
        shell: bash
        run: |
          # GitHub runs bash with -e by default; disable it so we can capture the log.
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace 2>&1 | tee /tmp/gradle-build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            {
              echo "### خروجی Gradle (exit $rc)"
              echo '```text'
              tail -n 200 /tmp/gradle-build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          cp /tmp/gradle-build.log "$GITHUB_WORKSPACE/ci-gradle.log" || true
          exit "$rc"

      - name: ذخیره لاگ ساخت
        if: failure()
        run: |
          git config user.email "ci@users.noreply.github.com"
          git config user.name "CI Bot"
          git add ci-gradle.log
          git commit -m "ci: لاگ ساخت Gradle" || echo "nothing to commit"
          git push origin "HEAD:${GITHUB_REF_NAME}" || echo "log push skipped"

      - name: بارگذاری APK
        uses: actions/upload-artifact@v4
        with:
          name: HooshyarPOS-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
