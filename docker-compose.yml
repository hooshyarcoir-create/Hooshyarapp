services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${HOOSHYAR_DB_NAME:-hooshyar_pos}
      MYSQL_USER: ${HOOSHYAR_DB_USER:-hooshyar}
      MYSQL_PASSWORD: ${HOOSHYAR_DB_PASSWORD:?Set HOOSHYAR_DB_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - hooshyar_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  php-api:
    build:
      context: .
      dockerfile: backend/php/Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      HOOSHYAR_DB_DRIVER: mysql
      HOOSHYAR_DB_HOST: mysql
      HOOSHYAR_DB_PORT: 3306
      HOOSHYAR_DB_NAME: ${HOOSHYAR_DB_NAME:-hooshyar_pos}
      HOOSHYAR_DB_USER: ${HOOSHYAR_DB_USER:-hooshyar}
      HOOSHYAR_DB_PASSWORD: ${HOOSHYAR_DB_PASSWORD:?Set HOOSHYAR_DB_PASSWORD in .env}
      HOOSHYAR_API_TOKEN: ${HOOSHYAR_API_TOKEN:?Set HOOSHYAR_API_TOKEN in .env}
    ports:
      - "${HOOSHYAR_API_PORT:-8080}:80"

volumes:
  hooshyar_mysql:
