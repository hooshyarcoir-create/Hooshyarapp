<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111318"><title>صورتحساب مشتری | هوشیار</title><link rel="stylesheet" href="css/style.css"><style>
body{min-height:100vh;background:#101217;color:#e9edf4;padding:24px 14px;font-family:Vazirmatn,system-ui,sans-serif}.public-invoice{max-width:620px;margin:0 auto}.public-head,.public-card{background:#191c24;border:1px solid #2a2e39;border-radius:16px;padding:20px;margin-bottom:14px}.public-head{text-align:center}.public-mark{width:48px;height:48px;border-radius:15px;background:#efaa4b;color:#17191e;display:grid;place-items:center;font-size:27px;font-weight:800;margin:0 auto 10px}.public-head h1{font-size:20px;margin:4px}.public-head p{color:#a5acb8;margin:5px}.public-row{display:flex;gap:16px;justify-content:space-between;padding:10px 0;border-bottom:1px dashed #333946}.public-row:last-child{border:0}.public-small{font-size:12px;color:#a5acb8}.public-total{font-weight:800;font-size:19px;color:#f1b15d}.public-lines{width:100%;border-collapse:collapse}.public-lines th,.public-lines td{text-align:right;padding:10px 5px;border-bottom:1px solid #303440}.public-lines th{font-size:12px;color:#a5acb8}.public-footer{text-align:center;color:#a5acb8;font-size:12px;padding:10px}.public-error{max-width:520px;margin:10vh auto;text-align:center;background:#191c24;border-radius:16px;padding:28px}.public-actions{text-align:center;margin:16px}.public-actions button{padding:10px 18px;border:0;border-radius:10px;background:#efaa4b;color:#16181d;font-weight:700}
@media print{body{background:white;color:black;padding:0}.public-head,.public-card{background:white;color:black;border:0;padding:8px;margin-bottom:4px}.public-row{border-color:#aaa}.public-small,.public-footer{color:#444}.public-actions{display:none}}
</style></head><body><main id="app" class="public-invoice"><div class="public-error">در حال بارگذاری صورتحساب…</div></main><script>
(function(){'use strict';var root=document.getElementById('app');function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}function num(v){try{return new Intl.NumberFormat('fa-IR').format(Number(v)||0);}catch(e){return String(v||0);}}function err(m){root.innerHTML='<section class="public-error"><div style="font-size:30px">◷</div><h2>صورتحساب در دسترس نیست</h2><p class="public-small">'+esc(m)+'</p></section>';}
try{var hash=new URLSearchParams(location.hash.slice(1)),raw=hash.get('v'),token=hash.get('t');if(!raw||!token)throw Error('پیوند ناقص است یا صورتحساب روی میزبان قابل دسترسی نیست. از فرستنده، نسخه کامل پیوند را درخواست کنید.');var json=decodeURIComponent(escape(atob(raw.replace(/-/g,'+').replace(/_/g,'/')))),d=JSON.parse(json);if(!d||!d.no||!Array.isArray(d.lines)||!d.total)throw Error('ساختار اطلاعات صورتحساب معتبر نیست.');var rows=d.lines.map(function(x){return '<tr><td>'+esc(x.n)+'</td><td class="num">'+num(x.q)+'</td><td class="num">'+num(x.p)+'</td><td class="num">'+num((Number(x.p)||0)*(Number(x.q)||0)-(Number(x.d)||0))+'</td></tr>';}).join('');var h='<header class="public-head"><div class="public-mark">ه</div><h1>'+esc(d.restaurant||'صورتحساب مشتری')+'</h1><p>'+esc(d.address||'')+'</p><p>'+esc(d.phone||'')+'</p></header><section class="public-card"><div class="public-row"><b>صورتحساب شماره '+num(d.no)+'</b><span class="public-small">'+esc(new Date(d.at||Date.now()).toLocaleString('fa-IR'))+'</span></div><div class="public-row"><span>نوع / میز</span><span>'+esc((d.type||'')+' · '+(d.hall||'')+' '+(d.table||''))+'</span></div>'+(d.customer?'<div class="public-row"><span>مشتری</span><span>'+esc(d.customer)+'</span></div>':'')+'<table class="public-lines"><thead><tr><th>شرح کالا</th><th>تعداد</th><th>قیمت واحد</th><th>مبلغ</th></tr></thead><tbody>'+rows+'</tbody></table><div class="public-row"><span>جمع اقلام</span><span>'+num(d.subtotal)+' '+esc(d.currency||'')+'</span></div>'+(d.lineDiscount?'<div class="public-row"><span>تخفیف ردیفی</span><span>− '+num(d.lineDiscount)+'</span></div>':'')+(d.discount?'<div class="public-row"><span>تخفیف فاکتور</span><span>− '+num(d.discount)+'</span></div>':'')+(d.tax?'<div class="public-row"><span>مالیات</span><span>'+num(d.tax)+'</span></div>':'')+(d.levy?'<div class="public-row"><span>عوارض</span><span>'+num(d.levy)+'</span></div>':'')+'<div class="public-row public-total"><span>مبلغ نهایی</span><span>'+num(d.total)+' '+esc(d.currency||'')+'</span></div><h3>پرداخت‌ها</h3>'+((d.payments||[]).map(function(p){return '<div class="public-row"><span>'+esc(p.m)+'</span><span>'+num(p.a)+'</span></div>';}).join('')||'<div class="public-small">اطلاعات پرداخت ثبت نشده است.</div>')+'</section><footer class="public-footer">'+esc(d.footer||'')+'<br>نسخه '+num(d.revision||1)+' · پیوند دارای شناسه '+esc(token.slice(0,5))+'</footer><div class="public-actions"><button onclick="window.print()">چاپ صورتحساب</button></div>';root.innerHTML=h;
}catch(e){err(e.message||'خطا در خواندن صورتحساب.');}})();
</script></body></html>
